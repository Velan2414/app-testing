    <!-- SEO Meta Tags -->

    <meta property="og:type" content="website" />

    <meta property="twitter:card" content="summary" />

  <body>
    <div id="root">
      <!-- Clean loading fallback while React initializes -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: Inter, system-ui, sans-serif; background-color: #f7fafd; color: #181c1e;">
        <div style="width: 40px; height: 40px; border: 3px solid #003d9b; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.1px; color: #434654;">Loading MediQR secure portal...</div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
